name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # The HACS action refuses private repositories, so this job is skipped
    # until the repository is public. It then runs with no further change.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
